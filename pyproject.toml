[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "convax"
version = "0.0.0"
description = "Convex set manipulation library in JAX with Equinox"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Theodore Pinkerton", email = "ted@tedpinkerton.ca" }]
dependencies = [
  "equinox>=0.13.8,<0.14",
  "jax>=0.11.1,<0.12",
  "jaxtyping>=0.3.11,<0.4",
]

[project.urls]
Documentation = "https://convax.tedpinkerton.ca/"
Issues = "https://github.com/RunnersNum40/convax/issues"
Repository = "https://github.com/RunnersNum40/convax"

[dependency-groups]
dev = [
  "prek==0.4.14",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.3",
  "ty==0.0.72",
  "typeguard>=2.13.3,<3",
]
docs = ["mkdocstrings-python==2.0.7", "zensical==0.0.56"]

[tool.ty.src]
include = ["src", "tests", "examples"]

[tool.ty.environment]
python-version = "3.13"

[tool.pytest]
addopts = [
  "--jaxtyping-packages=convax,typeguard.typechecked",
  "--cov=convax",
  "--cov-report=term-missing",
  "--import-mode=importlib",
  "-Werror",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
ignore = ["E501", "F722", "F821"]
select = ["B", "C4", "E", "F", "I", "PIE", "PT", "RUF", "SIM", "UP"]

[tool.ruff.format]
docstring-code-format = true

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
