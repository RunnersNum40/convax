repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --check .
        language: system
        files: ^(src|tests|examples)/.*\.py$|^pyproject\.toml$
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check .
        language: system
        files: ^(src|tests|examples)/.*\.py$|^pyproject\.toml$
        pass_filenames: false

      - id: ty
        name: ty
        entry: uv run --locked ty check
        language: system
        files: ^(src|tests|examples)/.*\.py$|^pyproject\.toml$
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run --locked pytest --no-cov
        language: system
        files: ^(src|tests)/.*\.py$|^pyproject\.toml$
        pass_filenames: false

      - id: documentation
        name: documentation
        entry: uv run --locked --group docs zensical build --clean --strict
        language: system
        files: ^(docs/|src/|zensical\.toml$|pyproject\.toml$)
        pass_filenames: false
