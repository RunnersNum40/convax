name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # 9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
      - name: Verify tag version
        run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"
      - name: Check lockfile
        run: uv lock --check
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Lint
        run: uv run --locked ruff check .
      - name: Type check
        run: uv run --locked ty check
      - name: Test
        run: uv run --locked pytest
      - name: Build
        run: uv build
      - name: Check wheel installation
        run: uv run --isolated --no-project --with dist/*.whl python -c "import convax"
      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # 9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
      - name: Build documentation
        run: uv run --locked --group docs zensical build --clean --strict
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  test-publish:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download built distributions
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # 9.0.0
        with:
          version: "0.12.5"
      - name: Publish to TestPyPI
        run: uv publish --index testpypi dist/*

  publish:
    name: Publish to PyPI
    needs: [build, docs, test-publish]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # 9.0.0
        with:
          version: "0.12.5"
      - name: Publish to PyPI
        run: uv publish dist/*

  deploy-docs:
    name: Deploy documentation
    needs: [docs, publish]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
