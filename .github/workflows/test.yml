name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # 9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
      - name: Check lockfile
        run: uv lock --check
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Lint
        run: uv run --locked ruff check .
      - name: Type check
        run: uv run --locked ty check
      - name: Test
        run: uv run --locked pytest

  x64:
    runs-on: ubuntu-latest
    env:
      JAX_ENABLE_X64: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # 9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
      - name: Test with 64-bit arrays
        run: uv run --locked pytest --no-cov

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # 9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
      - name: Build distributions
        run: uv build
      - name: Check wheel installation
        run: uv run --isolated --no-project --with dist/*.whl python -c "import convax"
